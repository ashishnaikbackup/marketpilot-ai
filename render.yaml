services:
  - type: web
    name: marketpilot-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: MarketPilot AI API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: https://ashishnaikbackup.github.io
      - key: MARKETPILOT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
