name = "marketpilot-api"
main = "src/index.js"
compatibility_date = "2026-11-13"
workers_dev = true

[observability]
enabled = true

[ai]
binding = "AI"
remote = true

# Poll every 5 minutes on weekdays. Worker gates India to its session and global scans to 15-minute intervals; it writes EOD summaries after each region's close.
[triggers]
crons = ["*/5 * * * 1-5"]

# Add a D1 binding named DB after creating the database in Cloudflare.
# Keep the database ID in Cloudflare config/secrets, never in frontend source.
