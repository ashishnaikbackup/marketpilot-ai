name = "marketpilot-api"
main = "src/index.js"
compatibility_date = "2026-11-13"
workers_dev = true

[observability]
enabled = true

[ai]
binding = "AI"
remote = true

# Scheduled EOD paper scans: India close + 20 minutes; global close + buffer.
[triggers]
crons = ["20 10 * * 1-5", "30 22 * * 1-5"]

# Add a D1 binding named DB after creating the database in Cloudflare.
# Keep the database ID in Cloudflare config/secrets, never in frontend source.
