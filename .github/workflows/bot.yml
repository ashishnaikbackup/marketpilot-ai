name: Paper bot

# The whole backend lives here: this job fetches market data, runs the paper-trading bot, stores its state and
# publishes JSON that the website reads. No servers, no Cloudflare, no tokens typed into the website.
# GitHub cron is best-effort and was observed not to fire, so each run loops for ~5.5 hours (a tick every 10 minutes in
# market hours, 30 otherwise) and then starts the next run itself. The cron above only restarts the chain if it breaks.
on:
  schedule:
    - cron: "17 */5 * * *"        # safety net: restarts the chain if it ever stops
  workflow_dispatch:
    inputs:
      eod_now:
        description: "Also run the end-of-day pass for both markets now (fills the International view with the last close)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: cd cloudflare-worker && node --test
      - name: Restore bot data
        run: |
          mkdir bot-data
          if git fetch --depth=1 origin bot-data:refs/remotes/origin/bot-data 2>/dev/null; then
            git archive origin/bot-data | tar -x -C bot-data
            echo "Restored previous state."
          else
            echo "No previous state; starting fresh."
          fi
      - name: Run bot ticks (publishes after every tick)
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_EOD: ${{ inputs.eod_now && '1' || '0' }}
          PUBLISH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: node runner/run.mjs bot-data --loop 330
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" --ref main -f eod_now=false
