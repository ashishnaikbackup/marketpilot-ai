name: Refresh India universe

# Builds the list of every NSE F&O stock, index option underlying and ETF (with lot sizes and expiries)
# from Upstox's public instrument master, then commits it so the API redeploys with it.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1" # Mondays 08:00 IST

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build universe
        working-directory: cloudflare-worker
        run: node scripts/build-universe.mjs
      - name: Test and commit if changed
        working-directory: cloudflare-worker
        run: |
          node --test
          cd ..
          if git diff --quiet -- cloudflare-worker/src/universe-india.js; then echo "Universe unchanged."; exit 0; fi
          git config user.name "marketpilot-bot"
          git config user.email "marketpilot-bot@users.noreply.github.com"
          git add cloudflare-worker/src/universe-india.js
          git commit -m "Refresh India universe"
          git push
